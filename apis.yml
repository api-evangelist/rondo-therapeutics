name: Rondo Therapeutics
description: Rondo Therapeutics is a clinical-stage biotechnology company based in Hayward,
  California, developing immune-cell engaging bispecific antibodies designed to treat solid
  tumors by unleashing the immune system while maximizing efficacy and minimizing side effects.
  Founded in 2019 by Shelley Force Aldred and Nathan Trinklein, its pipeline includes RNDO-564
  (Phase 1 for bladder cancer) plus programs targeting ovarian, endometrial, and renal cancers,
  backed by a Series A led by Canaan and Red Tree Venture Capital and a collaboration with Eli
  Lilly. Rondo publishes a corporate and pipeline website but exposes no public developer program,
  API, or machine-readable API surface; it was surfaced as a portfolio company of canaan-partners
  and added to the API Evangelist network for enrichment.
